name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DWORKBOOST_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install
        run: cmake --install build --config Release --prefix build/stage
      - name: Installed CLI smoke
        shell: pwsh
        run: |
          $smoke = (Resolve-Path "$env:GITHUB_WORKSPACE\tests\integration\installed_cli_smoke.ps1").Path
          Push-Location build/stage
          try {
            & $smoke -BinDirectory (Resolve-Path .\bin).Path
          } finally {
            Pop-Location
          }

  mingw:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
      - name: Configure, build, test, and install
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DWORKBOOST_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix build/stage
      - name: Installed CLI smoke
        shell: pwsh
        run: |
          $smoke = (Resolve-Path "$env:GITHUB_WORKSPACE\tests\integration\installed_cli_smoke.ps1").Path
          Push-Location build/stage
          try {
            & $smoke -BinDirectory (Resolve-Path .\bin).Path
          } finally {
            Pop-Location
          }
